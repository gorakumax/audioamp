<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>あんしん集音器</title>
    <script src="cordova.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 0; margin: 0; line-height: 1.2; }
        .container { width: 100%; max-width: 360px; margin: auto; padding: 10px; box-sizing: border-box; }
        .app-header { font-size: 1.1rem; color: #888; margin: 10px 0; }
        .page { display: none; }
        .page.active { display: block; }

        /* ガイド */
        .guide-box { background: #1a1a1a; border-radius: 12px; padding: 15px; border: 1px solid #333; text-align: left; margin-bottom: 12px; }
        .step { font-size: 1.2rem; margin-bottom: 8px; color: #ddd; }
        .step b { color: #00ff88; font-size: 1.4rem; margin-right: 5px; }
        
        /* スライダー下の警告 */
        .sub-warning { color: #ffcc00; font-size: 0.95rem; margin-top: 10px; display: block; text-align: center; font-weight: bold; background: #331100; padding: 5px; border-radius: 5px; }

        .status-lamp { font-size: 1.3rem; padding: 8px; background: #222; border-radius: 10px; margin-bottom: 12px; font-weight: bold; color: #666; border: 1px solid #444; }
        .is-running { background: #004d00; color: #00ff00; border-color: #00ff00; }
        .is-paused { background: #663300; color: #ff9900; border-color: #ff9900; }
        
        #startBtn { width: 100%; height: 110px; font-size: 3rem; border-radius: 25px; border: none; background: #007bff; color: white; font-weight: bold; box-shadow: 0 6px 0 #0056b3; margin-bottom: 20px; }
        #startBtn.active { background: #d9534f; box-shadow: 0 6px 0 #943a38; }
        
        .settings-btn { width: 90%; padding: 15px; font-size: 1.2rem; border-radius: 15px; background: #333; color: #fff; border: 1px solid #555; }
        .card { background: #1a1a1a; border-radius: 15px; padding: 20px; margin: 15px 0; border: 1px solid #444; }
        label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 1.4rem; color: #00ff88; }
        input[type=range] { width: 100%; height: 65px; margin: 10px 0; }
        .display-val { font-size: 2.5rem; font-weight: bold; }
        .save-return-btn { width: 100%; height: 80px; font-size: 2rem; border-radius: 40px; background: #28a745; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div id="pageMain" class="page active">
        <div class="app-header">あんしん集音器</div>
        <div class="guide-box">
            <div class="step"><b>1.</b>イヤホンをつける</div>
            <div class="step"><b>2.</b>下のボタンをおす</div>
            <div class="step"><b>3.</b>おとの調整</div>
        </div>
        <div id="status" class="status-lamp">電源：OFF</div>
        <button id="startBtn">開始</button>
        <p><button class="settings-btn" onclick="showPage('pageSettings')">⚙ おとの調整（音量など）</button></p>
    </div>

    <div id="pageSettings" class="page">
        <div class="app-header">おとの調整</div>
        <div class="card">
            <label>🔊 おとを大きく</label>
            <input type="range" id="volume" min="0" max="50" step="0.5" value="1">
            <div class="display-val"><span id="volVal">1.0</span>倍</div>
            <span class="sub-warning">⚠️ ちゅうい：まずは小さい音からためしてください</span>
        </div>
        <div class="card">
            <label>✨ こえをハッキリ</label>
            <input type="range" id="clarity" min="0" max="20" step="1" value="0">
            <div class="display-val"><span id="clarVal">0</span></div>
        </div>
        <button class="save-return-btn" onclick="showPage('pageMain')">設定おわり</button>
    </div>
</div>

<script>
    let audioCtx, source, gainNode, filter, compressor, notch;
    const startBtn = document.getElementById('startBtn');
    const statusL = document.getElementById('status');
    const volSlider = document.getElementById('volume');
    const clarSlider = document.getElementById('clarity');

    document.addEventListener('deviceready', () => {
        const bg = window.cordova.plugins.backgroundMode;
        if (bg) {
            bg.enable();
            bg.overrideBackButton();
            bg.setDefaults({
                title: "あんしん集音器（動作中）",
                text: "あなたの耳をサポートしています",
                icon: 'icon', 
                color: '00FF88',
                sticky: true,
                resume: true,
                foreground: true,
                importance: 'high'
            });
            // バックグラウンド移行時の最適化を無効化
            bg.on('activate', () => { 
                bg.disableWebViewOptimizations(); 
            });
        }
    }, false);

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0, 0);
    }

    window.onload = () => {
        const v = localStorage.getItem('k_v') || 1;
        const c = localStorage.getItem('k_c') || 0;
        volSlider.value = v;
        clarSlider.value = c;
        document.getElementById('volVal').textContent = parseFloat(v).toFixed(1);
        document.getElementById('clarVal').textContent = c;
    };

    startBtn.onclick = async () => {
        if (!audioCtx) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
                source = audioCtx.createMediaStreamSource(stream);
                
                notch = audioCtx.createBiquadFilter(); notch.type = "notch"; notch.frequency.value = 4000; notch.Q.value = 10;
                compressor = audioCtx.createDynamicsCompressor();
                filter = audioCtx.createBiquadFilter(); filter.type = "highshelf"; filter.frequency.value = 2500; filter.gain.value = clarSlider.value;
                gainNode = audioCtx.createGain(); gainNode.gain.value = volSlider.value;
                
                source.connect(notch).connect(compressor).connect(filter).connect(gainNode).connect(audioCtx.destination);
                
                await audioCtx.resume();
                startBtn.textContent = "停止"; startBtn.classList.add('active');
                statusL.textContent = "● 動作中"; statusL.className = "status-lamp is-running";
            } catch (err) { alert("マイクを許可してください"); }
        } else {
            if (audioCtx.state === 'running') {
                audioCtx.suspend();
                startBtn.textContent = "再開"; startBtn.classList.remove('active');
                statusL.textContent = "一時停止中"; statusL.className = "status-lamp is-paused";
            } else {
                audioCtx.resume();
                startBtn.textContent = "停止"; startBtn.classList.add('active');
                statusL.textContent = "● 動作中"; statusL.className = "status-lamp is-running";
            }
        }
    };

    volSlider.oninput = (e) => {
        const v = parseFloat(e.target.value);
        if (gainNode) gainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        document.getElementById('volVal').textContent = v.toFixed(1);
        localStorage.setItem('k_v', v);
    };

    clarSlider.oninput = (e) => {
        const v = parseFloat(e.target.value);
        if (filter) filter.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        document.getElementById('clarVal').textContent = v;
        localStorage.setItem('k_c', v);
    };
</script>
</body>
</html>
