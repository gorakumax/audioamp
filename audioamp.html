<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>あんしん集音器</title>
    <script src="cordova.js"></script>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 0; margin: 0; }
        .container { width: 100%; max-width: 360px; margin: auto; padding: 10px; box-sizing: border-box; }
        .app-header { font-size: 1.1rem; color: #888; margin: 10px 0; }
        .page { display: none; }
        .page.active { display: block; }
        .guide-box { background: #1a1a1a; border-radius: 12px; padding: 10px; border: 1px solid #333; text-align: left; margin-bottom: 8px; }
        .step { font-size: 1.1rem; margin-bottom: 5px; color: #ddd; }
        .step b { color: #00ff88; font-size: 1.2rem; }
        .status-lamp { font-size: 1.3rem; padding: 8px; background: #222; border-radius: 10px; margin-bottom: 12px; font-weight: bold; color: #666; border: 1px solid #444; }
        .is-running { background: #004d00; color: #00ff00; border-color: #00ff00; }
        #startBtn { width: 100%; height: 100px; font-size: 2.8rem; border-radius: 20px; border: none; background: #007bff; color: white; font-weight: bold; box-shadow: 0 6px 0 #0056b3; margin-bottom: 20px; }
        #startBtn.active { background: #d9534f; box-shadow: 0 6px 0 #943a38; }
        .card { background: #1a1a1a; border-radius: 15px; padding: 15px; margin: 10px 0; border: 1px solid #444; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 1.3rem; color: #00ff88; }
        input[type=range] { width: 100%; height: 40px; margin: 15px 0; }
        .display-val { font-size: 2.2rem; font-weight: bold; }
        .save-return-btn { width: 100%; height: 80px; font-size: 2rem; border-radius: 40px; background: #28a745; color: white; border: none; }
    </style>
</head>
<body>
<div class="container">
    <div id="pageMain" class="page active">
        <div class="app-header">あんしん集音器</div>
        <div class="guide-box">
            <div class="step"><b>1.</b>イヤホンをつける</div>
            <div class="step"><b>2.</b>下のボタンをおす</div>
        </div>
        <div id="status" class="status-lamp">電源：OFF</div>
        <button id="startBtn">開始</button>
        <p><button style="width:90%; padding:10px; background:#333; color:#aaa; border:none; border-radius:10px;" onclick="showPage('pageSettings')">⚙ 設定</button></p>
    </div>

    <div id="pageSettings" class="page">
        <div class="app-header">設定</div>
        <div class="card"><label>🔊 音量</label><input type="range" id="volume" min="0" max="20" step="0.1" value="1"><div class="display-val"><span id="volVal">1.0</span>倍</div></div>
        <button class="save-return-btn" onclick="showPage('pageMain')">戻る</button>
    </div>
</div>

<script>
    let audioCtx, source, gainNode;
    const startBtn = document.getElementById('startBtn');
    const statusL = document.getElementById('status');
    const volSlider = document.getElementById('volume');

    document.addEventListener('deviceready', () => {
        const bg = window.cordova.plugins.backgroundMode;
        if (bg) {
            bg.setDefaults({
                title: "あんしん集音器",
                text: "バックグラウンドで動作中",
                icon: 'icon',
                color: '00FF88',
                importance: 'high'
            });
            bg.enable();
            // Android 15対策：省電力機能を無効化
            bg.on('activate', () => {
                bg.disableWebViewOptimizations();
                bg.disableBatteryOptimizations();
            });
        }
        
        // 通知許可を即座にリクエスト
        if (window.cordova.plugins.notification) {
            window.cordova.plugins.notification.local.requestPermission();
        }
    }, false);

    async function startAudio() {
        try {
            // Android 15対策：マイク使用直前に再度通知許可を確認
            if (window.cordova.plugins.notification) {
                window.cordova.plugins.notification.local.requestPermission();
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaStreamSource(stream);
            gainNode = audioCtx.createGain();
            gainNode.gain.value = volSlider.value;
            
            source.connect(gainNode).connect(audioCtx.destination);
            await audioCtx.resume();

            startBtn.textContent = "停止";
            startBtn.classList.add('active');
            statusL.textContent = "● 動作中";
            statusL.className = "status-lamp is-running";
        } catch (err) {
            alert("マイク許可が必要です");
        }
    }

    startBtn.onclick = () => {
        if (!audioCtx) {
            // Android 15対策：1秒待ってから開始
            setTimeout(startAudio, 1000);
        } else {
            if (audioCtx.state === 'running') {
                audioCtx.suspend();
                startBtn.textContent = "再開";
                startBtn.classList.remove('active');
                statusL.textContent = "一時停止";
            } else {
                audioCtx.resume();
                startBtn.textContent = "停止";
                startBtn.classList.add('active');
                statusL.textContent = "● 動作中";
            }
        }
    };

    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    volSlider.oninput = (e) => {
        const v = parseFloat(e.target.value);
        if (gainNode) gainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.01);
        document.getElementById('volVal').textContent = v.toFixed(1);
    };
</script>
</body>
</html>
