<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>あんしん集音器</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 0; margin: 0; line-height: 1.5; }
        .container { width: 100%; max-width: 360px; margin: auto; padding: 20px 10px; box-sizing: border-box; }
        
        h1 { color: #00ff88; font-size: 1.8rem; margin-bottom: 20px; }

        /* メリット・デメリットのカード */
        .info-card { background: #1a1a1a; border-radius: 15px; padding: 15px; text-align: left; border: 1px solid #333; margin-bottom: 20px; }
        .info-card h2 { font-size: 1.1rem; margin-top: 0; color: #00ff88; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .info-card ul { padding-left: 20px; margin: 10px 0; font-size: 0.95rem; color: #ddd; }
        .info-card li { margin-bottom: 8px; }

        /* メインの起動ボタン */
        .btn-main {
            display: flex; justify-content: center; align-items: center;
            width: 100%; height: 100px; font-size: 2.2rem; text-decoration: none;
            background: #007bff; color: #fff; border-radius: 20px; font-weight: bold;
            box-shadow: 0 6px 0 #0056b3; margin-bottom: 30px;
        }
        .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #0056b3; }

        /* APKダウンロードボタン */
        .btn-apk {
            display: inline-block; width: 80%; padding: 12px; font-size: 1rem;
            text-decoration: none; background: #333; color: #aaa;
            border-radius: 10px; border: 1px solid #555; margin-top: 10px;
        }
        .btn-apk b { color: #fff; }

        .footer { font-size: 0.8rem; color: #666; margin-top: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1>あんしん集音器</h1>

    <div class="info-card">
        <h2>✅ よいところ</h2>
        <ul>
            <li>ボタン一つで開始。操作がかんたん</li>
            <li>前回と同じ音量で、すぐ始められる</li>
            <li>片耳イヤホンでも聞こえるモノラル設計</li>
        </ul>
        <h2>⚠️ 注意点</h2>
        <ul>
            <li>無線(Bluetooth)は少し音が遅れます</li>
            <li>スマホの底のマイクを相手に向けます</li>
        </ul>
    </div>

    <a href="audioamp.html" class="btn-main">アプリを開く</a>

    <a href="/download/ansin-audioamp.apk" class="btn-apk">
        Android用 <b>アプリ(APK)を保存</b>
    </a>

    <div class="footer">v1.0.0</div>
</div>

</body>
</html>
