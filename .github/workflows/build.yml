name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets @capacitor/cli @capacitor/android @capacitor/core
          # ↓この行を確実に追加
          npm install cordova-plugin-local-notification

      - name: Prepare Assets & Web Directory
        run: |
          rm -rf www
          mkdir -p www
          mkdir -p assets
          cp icon.png assets/icon.png || true
          cp icon.png icon.png || true
          cp audioamp.html www/index.html

      - name: Capacitor Setup & Icon Generate
        run: |
          rm -rf android
          npx cap init "あんしん集音器" "jp.kuma.audioamp" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android || echo "Icon generation skipped"
      
      - name: Inject Android Manifest (Android 15 Ultimate Fix)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # 既存の定義を一度完全に消去
          sed -i '/de.appplant.cordova.plugin.background.ForegroundService/d' $MANIFEST
          
          # 権限追加 (Android 15必須セット)
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          
          # サービス定義 (Android 15が認める厳格な「型」)
          sed -i '/<\/activity>/a \
          <service android:name="de.appplant.cordova.plugin.background.ForegroundService" \
                   android:foregroundServiceType="microphone" \
                   android:enabled="true" \
                   android:exported="false" />' $MANIFEST

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Force API Level 34 (Safe Append)
        run: |
          GRADLE="android/app/build.gradle"
          echo "" >> $GRADLE
          echo "android.compileSdkVersion = 34" >> $GRADLE
          echo "android.defaultConfig.targetSdkVersion = 34" >> $GRADLE

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ansin-audioamp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ansin-audioamp-package
          path: ansin-audioamp.apk