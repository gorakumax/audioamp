name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/core
          # Android 15でバックグラウンド維持に必須の2つに絞る
          npm install cordova-plugin-background-mode cordova-plugin-local-notification
      - name: Prepare Assets
        run: |
          mkdir -p www assets
          cp icon.png assets/icon.png || true
          cp audioamp.html www/index.html
      - name: Capacitor Setup
        run: |
          rm -rf android
          npx cap init "あんしん集音器" "jp.kuma.audioamp" --web-dir www
          npx cap add android
      - name: Android 15 Manifest Fix
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # 権限とサービスを「1行ずつ」確実に追加
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          sed -i '/<\/activity>/a <service android:name="de.appplant.cordova.plugin.background.ForegroundService" android:foregroundServiceType="microphone" android:exported="false" />' $MANIFEST
      - name: Capacitor Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ansin-audioamp.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ansin-audioamp-package
          path: ansin-audioamp.apk