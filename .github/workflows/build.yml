name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets

      - name: Prepare Assets & Web Directory
        run: |
          # フォルダがなければ作る
          mkdir -p assets
          mkdir -p www
          # ルートにあるicon.pngをassetsにコピー(保険)
          cp icon.png assets/icon.png || true
          # HTMLをwwwにコピー
          cp audioamp.html www/index.html
          cp audioamp.html www/audioamp.html

      - name: Capacitor Setup & Icon Generate
        run: |
          # 1. 一度リセット
          rm -rf android
          
          # 2. Androidプロジェクトを再作成（設定はconfig.jsonから読み込まれます）
          npx cap add android
          
          # 3. アイコン生成
          npx capacitor-assets generate --android --icon-path assets/icon.png || echo "Icon generation skipped"

      - name: Inject Android Manifest (Permissions & Background)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' $MANIFEST
          sed -i '/<\/activity>/a <service android:name="de.appplant.cordova.plugin.background.ForegroundService" android:foregroundServiceType="microphone" />' $MANIFEST

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ansin-audioamp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ansin-audioamp-package
          path: ansin-audioamp.apk