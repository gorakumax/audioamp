name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4  # ここを v4 に修正

      - name: Set up JDK 17
        uses: actions/setup-java@v4  # ここを v4 に修正
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp audioamp.html www/index.html  # Capacitorはindex.htmlを欲しがるのでコピー
          cp audioamp.html www/audioamp.html

      - name: Capacitor Setup & Icon Generate
        run: |
          npx cap add android
          npx capacitor-assets generate --android

      - name: Inject Android Manifest (Permissions & Background)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' $MANIFEST
          sed -i '/<\/activity>/a <service android:name="de.appplant.cordova.plugin.background.ForegroundService" android:foregroundServiceType="microphone" />' $MANIFEST

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          # 生成されたファイルを「ansin-audioamp.apk」としてルートにコピー
          cp app/build/outputs/apk/debug/app-debug.apk ../ansin-audioamp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ansin-audioamp-package
          path: ansin-audioamp.apk
